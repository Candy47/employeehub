spring.application.name=employee-service
server.port=8082

# =========================
# Database (own database - employee_db)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5433/employee_db?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres

# =========================
# JPA (Flyway owns the schema; Hibernate only validates it)
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

# Producer (used only by the dead-letter publisher)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer - own group so events fan out to this service independently
spring.kafka.consumer.group-id=employee-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON Deserialization (events come from Debezium without type headers)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.employeehub.employee.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.employeehub.employee.events.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# =========================
# Logging (cleaner console)
# =========================
# Hide Kafka's huge config-dump blocks (ssl.*/sasl.* etc.) but keep useful logs.
logging.level.org.apache.kafka.clients.admin.AdminClientConfig=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
logging.level.org.apache.kafka.common.utils.AppInfoParser=WARN
logging.level.org.apache.kafka.common.metrics.Metrics=WARN

# Short, readable console pattern (time, level, short logger, message).
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr(%-36.36logger{35}){cyan} %clr(:){faint} %m%n

# =========================
# DevTools (hot reload)
# =========================
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s


