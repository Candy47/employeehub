spring.application.name=auth-service

# =========================
# Database
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5433/auth_db?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=employeehub-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.employeehub.auth.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.employeehub.auth.event.UserRegisteredEvent

# =========================
# Logging (cleaner console)
# =========================
# Hide Kafka's huge config-dump blocks (ssl.*/sasl.* etc.) but keep useful logs.
logging.level.org.apache.kafka.clients.admin.AdminClientConfig=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
logging.level.org.apache.kafka.common.utils.AppInfoParser=WARN
logging.level.org.apache.kafka.common.metrics.Metrics=WARN

# Short, readable console pattern (time, level, short logger, message).
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr(%-36.36logger{35}){cyan} %clr(:){faint} %m%n

